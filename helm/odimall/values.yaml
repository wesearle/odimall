images:
  frontend: wsearle/odimall:frontend

# HTTPS between load-generator / frontend and api-gateway (verified via private CA).
# Clients mount ca.crt and verify — no InsecureSkipVerify.
interServiceTls:
  enabled: true
  # Default Secret name: <release>-api-gateway-tls (tls.crt, tls.key, ca.crt)
  secretName: ""

# MySQL storage. Persistent by default (PVC) so data survives pod restarts.
# Set persistence.enabled=false to use ephemeral emptyDir storage instead:
# no StorageClass needed, and the database is re-seeded from the init
# ConfigMap on every restart (handy for kind/minikube or throwaway demos).
mysql:
  persistence:
    enabled: true
    size: 1Gi
    # Leave empty to use the cluster's default StorageClass.
    storageClassName: ""

rum:
  enabled: false
  endpoint: ""
  otlpInsecure: true

rumEnabled: false
rumEndpoint: ""

# ClickStack / HyperDX browser SDK (session replay, RUM, frontend traces).
# Self-hosted: set url to your OTLP HTTP collector (port 4318) and provide an ingestion API key.
clickstack:
  enabled: false
  url: ""
  service: odigear-frontend
  createSecret: true
  secretName: ""
  secretKey: CLICKSTACK_API_KEY
  dummyApiKey: "replace-me-with-your-clickstack-ingestion-key"

clickstackEnabled: false
clickstackUrl: ""

# When true, creates an Odigos Source that disables instrumentation on the frontend Deployment.
# Leave false so Odigos instruments the BFF alongside ClickStack browser SDK (session replay).
odigos:
  excludeFrontend: false

# Authentication + SQL-injection breach demo (auth-service).
# auth-service seeds a `users` table and serves /auth/login. By default it runs an
# INTENTIONALLY VULNERABLE username lookup so the credential-dump attack works out
# of the box. Set secureQueries=true to run the remediated, parameterized path.
authService:
  secureQueries: false
  jwtSecret: "odimall-demo-signing-key"

loadGenerator:
  interval: "5s"
  # When true, every other automated order buys Rapid River Kayak (#6) with X-OdiMall-Kayak-Chaos.
  kayakFaultEnabled: false
  # Attacker simulation: when true the load generator periodically runs the breach
  # sequence against /auth/login — a SQL-injection credential dump followed by a
  # login with a stolen credential from an anomalous origin (fake IP + odd UA).
  # Off by default so normal auth traffic stays the baseline the anomaly stands out against.
  attackEnabled: false
  # Seconds between attacker bursts (one dump + one stolen-credential login per burst).
  attackIntervalSeconds: 30
  # Comma-separated product IDs the load generator never buys or browses. "3,5" turns off the
  # Glacier DB-lock and Storm Chaser Kafka patterns (use with orderService.promoFaultEnabled).
  excludeProductIds: ""

# Promo pricing fault (Java custom-instrumentation demo). When true, order-service loads a bad
# promo-rules revision and checkouts containing boots (#1) or the jacket (#7) fail with HTTP 500.
orderService:
  promoFaultEnabled: false
  # CPU time (ms) DiscountStackResolver burns per failing order, so it shows in profiles. 0 = off.
  promoResolverBurnMs: 800

apiGateway:
  vmPipelineAlphaUrl: ""
  windowsPipelineBaseUrl: ""
  # Python Lambda Function URL (entry hop). Empty = Lambda navbar button returns 503.
  # After ./lambda-edge-services/deploy.sh, set via:
  #   --set apiGateway.lambdaPipelineUrl="<PYTHON_FUNCTION_URL>"
  # or: kubectl set env deployment/api-gateway -n odimall LAMBDA_PIPELINE_URL="..."
  lambdaPipelineUrl: ""

alloy:
  image: grafana/alloy:v1.10.2
  stabilityLevel: experimental

# Product blurb: POST /products/{id}/ai-summary
# aiMode=demo — local template, no external LLM.
# aiMode=openai — OpenAI SDK (OPENAI_API_KEY).
# aiMode=gemini — Google Generative AI SDK (GEMINI_API_KEY); enable productService.gemini and patch Secret.
productService:
  aiMode: demo
  openaiModel: gpt-4o-mini
  # New AI Studio keys often cannot use older Flash ids; prefer current GA (see Google error text).
  geminiModel: gemini-3.6-flash
  # Deprecated: use productService.openai.secretName. Still honored if set.
  openaiApiKeySecretName: ""
  openaiApiKeySecretKey: ""
  openai:
    enabled: true
    createSecret: true
    secretName: ""
    secretKey: OPENAI_API_KEY
    dummyApiKey: "sk-replace-me-with-your-openai-key"
  gemini:
    enabled: false
    createSecret: true
    secretName: ""
    secretKey: GEMINI_API_KEY
    dummyApiKey: "replace-me-with-your-gemini-api-key"
  langfuse:
    enabled: false
    baseUrl: "https://cloud.langfuse.com"
    createSecret: true
    secretName: ""
    publicKeySecretKey: LANGFUSE_PUBLIC_KEY
    secretKeySecretKey: LANGFUSE_SECRET_KEY
    dummyPublicKey: "pk-lf-replace-me-with-your-langfuse-public-key"
    dummySecretKey: "sk-lf-replace-me-with-your-langfuse-secret-key"
