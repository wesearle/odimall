{{- if eq (include "odimall.tls.enabled" . | trim) "true" }}
{{- $secretName := include "odimall.tls.secretName" . }}
{{- $ns := .Release.Namespace }}
{{- $existing := lookup "v1" "Secret" $ns $secretName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/part-of: odimall
    app.kubernetes.io/component: api-gateway-tls
type: Opaque
data:
{{- if and $existing $existing.data (index $existing.data "tls.crt") (index $existing.data "tls.key") (index $existing.data "ca.crt") }}
  tls.crt: {{ index $existing.data "tls.crt" }}
  tls.key: {{ index $existing.data "tls.key" }}
  ca.crt: {{ index $existing.data "ca.crt" }}
{{- else }}
{{- $ca := genCA "odimall-ca" 3650 }}
{{- $altNames := list "api-gateway" (printf "api-gateway.%s" $ns) (printf "api-gateway.%s.svc" $ns) (printf "api-gateway.%s.svc.cluster.local" $ns) }}
{{- $cert := genSignedCert "api-gateway" nil $altNames 3650 $ca }}
  tls.crt: {{ $cert.Cert | b64enc }}
  tls.key: {{ $cert.Key | b64enc }}
  ca.crt: {{ $ca.Cert | b64enc }}
{{- end }}
{{- end }}
