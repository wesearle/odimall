apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: {{ .Release.Namespace }}
  labels:
    app: product-service
    app.kubernetes.io/part-of: odimall
spec:
  replicas: 1
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
        app.kubernetes.io/part-of: odimall
    spec:
{{- if .Values.productService.imageEnrich }}
      # SSRF demo: bind the cloud metadata IP (169.254.169.254) to loopback so a
      # server-side request to it stays in-pod and is answered by the mock IMDS
      # sidecar — the Capital One chain, safely, without touching the real node.
      initContainers:
        - name: imds-route
          image: busybox:1.36
          command: ["sh", "-c", "ip addr add 169.254.169.254/32 dev lo 2>/dev/null || true; ip addr show lo"]
          securityContext:
            runAsUser: 0
            capabilities:
              add: ["NET_ADMIN"]
{{- end }}
      containers:
        - name: product-service
          image: wsearle/odimall:product-service
          imagePullPolicy: Always
          ports:
            - containerPort: 8082
          env:
            - name: DB_HOST
              value: "mysql"
            - name: DB_PORT
              value: "3306"
            - name: DB_USER
              value: "odimall"
            - name: DB_PASSWORD
              value: "odimall123"
            - name: DB_NAME
              value: "odimall"
            - name: ODIMALL_AI_MODE
              value: {{ .Values.productService.aiMode | quote }}
            - name: OPENAI_MODEL
              value: {{ .Values.productService.openaiModel | quote }}
            - name: GEMINI_MODEL
              value: {{ .Values.productService.geminiModel | quote }}
            # Supplier image enrichment (SSRF security demo). true = fetch any
            # caller-supplied URL server-side (SSRF sink); false = allowlist only.
            - name: IMAGE_ENRICH_ENABLED
              value: {{ (.Values.productService.imageEnrich | default false) | quote }}
{{- if .Values.productService.openai.enabled }}
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "odimall.openai.secretName" . | quote }}
                  key: {{ include "odimall.openai.secretKey" . | quote }}
{{- end }}
{{- if .Values.productService.gemini.enabled }}
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "odimall.gemini.secretName" . | quote }}
                  key: {{ include "odimall.gemini.secretKey" . | quote }}
{{- end }}
{{- if .Values.productService.langfuse.enabled }}
            - name: LANGFUSE_ENABLED
              value: "true"
            - name: LANGFUSE_BASE_URL
              value: {{ .Values.productService.langfuse.baseUrl | default "https://cloud.langfuse.com" | quote }}
            - name: LANGFUSE_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "odimall.langfuse.secretName" . | quote }}
                  key: {{ include "odimall.langfuse.publicKeySecretKey" . | quote }}
            - name: LANGFUSE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "odimall.langfuse.secretName" . | quote }}
                  key: {{ include "odimall.langfuse.secretKeySecretKey" . | quote }}
{{- end }}
          resources:
            requests:
              memory: {{ if .Values.productService.langfuse.enabled }}"256Mi"{{ else }}"128Mi"{{ end }}
              cpu: "100m"
            limits:
              memory: {{ if .Values.productService.langfuse.enabled }}"512Mi"{{ else }}"256Mi"{{ end }}
              cpu: "250m"
{{- if .Values.productService.imageEnrich }}
        # Mock AWS IMDSv2 — answers 169.254.169.254:80 inside the pod so the SSRF
        # demo returns realistic-but-fake node credentials (see imds-mock ConfigMap).
        - name: imds-mock
          image: python:3.11-slim
          command: ["python", "/opt/imds/mock-imds.py"]
          ports:
            - containerPort: 80
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: imds-mock
              mountPath: /opt/imds
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "64Mi"
              cpu: "50m"
      volumes:
        - name: imds-mock
          configMap:
            name: imds-mock
{{- end }}

---
apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: {{ .Release.Namespace }}
  labels:
    app: product-service
    app.kubernetes.io/part-of: odimall
spec:
  selector:
    app: product-service
  ports:
    - port: 8082
      targetPort: 8082
