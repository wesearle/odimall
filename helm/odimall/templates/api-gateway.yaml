{{- $tlsEnabled := eq (include "odimall.tls.enabled" . | trim) "true" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    app: api-gateway
    app.kubernetes.io/part-of: odimall
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
        app.kubernetes.io/part-of: odimall
{{- if $tlsEnabled }}
      annotations:
        checksum/tls: {{ include (print $.Template.BasePath "/tls-secret.yaml") . | sha256sum }}
{{- end }}
    spec:
      containers:
        - name: api-gateway
          image: wsearle/odimall:api-gateway
          imagePullPolicy: Always
          ports:
            - containerPort: 8081
          env:
            - name: PRODUCT_SERVICE_URL
              value: "http://product-service:8082"
            - name: CART_SERVICE_URL
              value: "http://cart-service:8083"
            - name: USER_SERVICE_URL
              value: "http://user-service:8084"
            - name: ORDER_SERVICE_URL
              value: "http://order-service:8085"
{{- if $tlsEnabled }}
            - name: SERVER_SSL_ENABLED
              value: "true"
            - name: SERVER_SSL_CERTIFICATE
              value: "file:/etc/odimall/tls/tls.crt"
            - name: SERVER_SSL_CERTIFICATE_PRIVATE_KEY
              value: "file:/etc/odimall/tls/tls.key"
{{- end }}
            {{- if .Values.apiGateway.vmPipelineAlphaUrl }}
            - name: VM_PIPELINE_ALPHA_URL
              value: {{ .Values.apiGateway.vmPipelineAlphaUrl | quote }}
            {{- end }}
            {{- if .Values.apiGateway.windowsPipelineBaseUrl }}
            - name: WINDOWS_PIPELINE_BASE_URL
              value: {{ .Values.apiGateway.windowsPipelineBaseUrl | quote }}
            {{- end }}
            {{- if .Values.apiGateway.lambdaPipelineUrl }}
            - name: LAMBDA_PIPELINE_URL
              value: {{ .Values.apiGateway.lambdaPipelineUrl | quote }}
            {{- end }}
{{- if $tlsEnabled }}
          volumeMounts:
            - name: tls
              mountPath: /etc/odimall/tls
              readOnly: true
{{- end }}
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
{{- if $tlsEnabled }}
      volumes:
        - name: tls
          secret:
            secretName: {{ include "odimall.tls.secretName" . }}
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
{{- end }}

---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    app: api-gateway
    app.kubernetes.io/part-of: odimall
spec:
  selector:
    app: api-gateway
  ports:
    - port: 8081
      targetPort: 8081
