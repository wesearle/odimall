apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-generator
  namespace: odimall
  labels:
    app: load-generator
    app.kubernetes.io/part-of: odimall
spec:
  replicas: 1
  selector:
    matchLabels:
      app: load-generator
  template:
    metadata:
      labels:
        app: load-generator
        app.kubernetes.io/part-of: odimall
    spec:
      containers:
        - name: load-generator
          image: wsearle/odimall:load-generator
          imagePullPolicy: Always
          env:
            - name: GATEWAY_URL
              value: "https://api-gateway:8081"
            - name: TLS_CA_FILE
              value: "/etc/odimall/tls/ca.crt"
            - name: INTERVAL
              value: "5s"
          volumeMounts:
            - name: tls-ca
              mountPath: /etc/odimall/tls
              readOnly: true
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "64Mi"
              cpu: "100m"
      volumes:
        - name: tls-ca
          secret:
            secretName: odimall-api-gateway-tls
            items:
              - key: ca.crt
                path: ca.crt
