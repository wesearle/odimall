# Grafana Alloy: receives OTLP from OTEL Java agents and forwards to LGTM.
apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-otel
  namespace: odimall
  labels:
    app: alloy-otel
    app.kubernetes.io/part-of: odimall
data:
  config.alloy: |
    otelcol.receiver.otlp "default" {
      grpc {
        endpoint = "0.0.0.0:4317"
      }
      http {
        endpoint = "0.0.0.0:4318"
      }

      output {
        traces  = [otelcol.processor.batch.default.input]
        metrics = [otelcol.processor.batch.default.input]
        logs    = [otelcol.processor.batch.default.input]
      }
    }

    otelcol.processor.batch "default" {
      output {
        traces  = [otelcol.exporter.otlp.lgtm.input]
        metrics = [otelcol.exporter.otlp.lgtm.input]
        logs    = [otelcol.exporter.otlp.lgtm.input]
      }
    }

    otelcol.exporter.otlp "lgtm" {
      client {
        endpoint = "lgtm.default.svc.cluster.local:4317"
        tls {
          insecure             = true
          insecure_skip_verify = true
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alloy-otel
  namespace: odimall
  labels:
    app: alloy-otel
    app.kubernetes.io/part-of: odimall
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alloy-otel
  template:
    metadata:
      labels:
        app: alloy-otel
        app.kubernetes.io/part-of: odimall
    spec:
      containers:
        - name: alloy
          image: grafana/alloy:v1.10.2
          imagePullPolicy: IfNotPresent
          args:
            - run
            - --server.http.listen-addr=0.0.0.0:12345
            - --storage.path=/tmp/alloy
            - /etc/alloy/config.alloy
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: http
              containerPort: 12345
          volumeMounts:
            - name: config
              mountPath: /etc/alloy
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 12345
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 12345
            initialDelaySeconds: 10
            periodSeconds: 20
      volumes:
        - name: config
          configMap:
            name: alloy-otel
---
apiVersion: v1
kind: Service
metadata:
  name: alloy-otel
  namespace: odimall
  labels:
    app: alloy-otel
    app.kubernetes.io/part-of: odimall
spec:
  type: ClusterIP
  selector:
    app: alloy-otel
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
    - name: http
      port: 12345
      targetPort: http
