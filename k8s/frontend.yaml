apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: odimall
  labels:
    app: frontend
    app.kubernetes.io/part-of: odimall
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        app.kubernetes.io/part-of: odimall
    spec:
      containers:
        - name: frontend
          image: wsearle/odimall:frontend
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: API_GATEWAY_URL
              value: "https://api-gateway:8081"
            - name: NODE_EXTRA_CA_CERTS
              value: "/etc/odimall/tls/ca.crt"
          volumeMounts:
            - name: tls-ca
              mountPath: /etc/odimall/tls
              readOnly: true
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
      volumes:
        - name: tls-ca
          secret:
            secretName: odimall-api-gateway-tls
            items:
              - key: ca.crt
                path: ca.crt

---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: odimall
  labels:
    app: frontend
    app.kubernetes.io/part-of: odimall
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - port: 8080
      targetPort: 8080
