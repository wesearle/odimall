apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: odimall
  labels:
    app: auth-service
    app.kubernetes.io/part-of: odimall
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
        app.kubernetes.io/part-of: odimall
    spec:
      containers:
        - name: auth-service
          image: wsearle/odimall:auth-service
          imagePullPolicy: Always
          ports:
            - containerPort: 8090
          env:
            - name: DB_HOST
              value: "mysql"
            - name: DB_PORT
              value: "3306"
            - name: DB_USER
              value: "odimall"
            - name: DB_PASSWORD
              value: "odimall123"
            - name: DB_NAME
              value: "odimall"
            - name: JWT_SECRET
              value: "odimall-demo-signing-key"
            # Demo: intentionally vulnerable SQL by default so the credential-dump
            # breach is reproducible. Set to "true" for the remediated (parameterized) path.
            - name: AUTH_SECURE_QUERIES
              value: "false"
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"

---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: odimall
  labels:
    app: auth-service
    app.kubernetes.io/part-of: odimall
spec:
  selector:
    app: auth-service
  ports:
    - port: 8090
      targetPort: 8090
