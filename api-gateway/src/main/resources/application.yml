server:
  port: 8081
  # TLS is enabled in-cluster via SERVER_SSL_* env (see Helm interServiceTls).
  # When set: SERVER_SSL_ENABLED=true, SERVER_SSL_CERTIFICATE=file:..., SERVER_SSL_CERTIFICATE_PRIVATE_KEY=file:...

spring:
  application:
    name: api-gateway

services:
  product-url: ${PRODUCT_SERVICE_URL:http://product-service:8082}
  cart-url: ${CART_SERVICE_URL:http://cart-service:8083}
  user-url: ${USER_SERVICE_URL:http://user-service:8084}
  order-url: ${ORDER_SERVICE_URL:http://order-service:8085}

# Optional: laptop/kind → EC2 three-hop demo (C++ alpha on VM). Base URL only, no path.
vm-pipeline:
  alpha-url: ${VM_PIPELINE_ALPHA_URL:}

# Optional: laptop/kind → Windows EC2 .NET edge service. Base URL only, no path.
windows-pipeline:
  base-url: ${WINDOWS_PIPELINE_BASE_URL:}

# Optional: AWS Lambda edge chain (Python → Node → Java Function URLs). Full entry URL.
lambda-pipeline:
  url: ${LAMBDA_PIPELINE_URL:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
